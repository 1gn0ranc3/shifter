name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/release/_deps
          key: deps-macos-arm64-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-macos-arm64-

      - name: Configure
        run: >
          cmake -S . -B build/release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DSHIFTER_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build/release --target Shifter_VST3 shifter_tests

      - name: Test
        working-directory: build/release
        run: ctest --output-on-failure

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/release/src/Shifter_artefacts/Release/VST3/Shifter.vst3 dist/
          cd dist
          zip -ry Shifter-macOS-arm64.zip Shifter.vst3
          ls -la

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shifter-macOS-arm64
          path: dist/Shifter-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Shifter-macOS-arm64.zip
          generate_release_notes: true
          draft: false
          prerelease: false

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache CMake FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/release/_deps
          key: deps-windows-x64-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            deps-windows-x64-

      - name: Configure
        run: >
          cmake -S . -B build/release
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSHIFTER_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build/release --target Shifter_VST3 shifter_tests

      - name: Test
        working-directory: build/release
        run: ctest --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force `
            "build/release/src/Shifter_artefacts/Release/VST3/Shifter.vst3" `
            "dist/Shifter.vst3"
          Compress-Archive -Path "dist/Shifter.vst3" `
            -DestinationPath "dist/Shifter-Windows-x64.zip" -Force
          Get-ChildItem dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shifter-Windows-x64
          path: dist/Shifter-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Shifter-Windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
